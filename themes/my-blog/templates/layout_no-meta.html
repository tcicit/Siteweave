{% extends "base.html" %}

{% block content %}

    {% if featured_image %}
        <div class="featured-image">
            <img src="{{ featured_image }}" alt="{{ page_title or title }}">
        </div>
    {% endif %}

    <main class="content-area">
        <h1>{{ page_title }}</h1>
        {{ content | safe }}
    </main>
{% endblock %}
