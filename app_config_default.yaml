auto_open_last_project: true
language: en_US
paths:
  snippets: snippets
  themes: themes
  locales: locales
  pdf_themes: pdf_themes
  plugins: plugins
  scripts: scripts
media_manager_sort_index: 0
media_manager_sort_descending: false
external_editors:
- name: GIMP
  extensions:
  - .jpg
  - .jpeg
  - .png
  - .webp
  - .xcf
  - .gif
  command:
  - flatpak
  - run
  - org.gimp.GIMP
  icon: applications-other
- name: Inkscape
  extensions:
  - .svg
  command:
  - flatpak
  - run
  - org.inkscape.Inkscape
  icon: applications-other
- name: xreader
  extensions:
  - .pdf
  command:
  - xreader
  - '%U'
  icon: applications-other
window_width: 1200
window_height: 800
window_x: 100
window_y: 100
recent_projects:
